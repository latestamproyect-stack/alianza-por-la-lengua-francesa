<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Alianza por la Lengua Francesa · La Paz, BCS</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap">
<style>
:root{--bg:#f5f6fa;--sf:#fff;--tx:#141a30;--mu:#566079;--bl:#1b3a8f;--rd:#b3122b;--ln:#d9dde9;--navy:#0f1b4a;--btn:#1b3a8f;--bt:#fff;
--serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;--sans:"Jost","Helvetica Neue",Arial,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1020;--sf:#121933;--tx:#eceff8;--mu:#a8b1cb;--bl:#9fb4ff;--rd:#ff7b90;--ln:#262e4d;--navy:#0a1233;--btn:#3552c9}}
:root[data-theme="dark"]{--bg:#0b1020;--sf:#121933;--tx:#eceff8;--mu:#a8b1cb;--bl:#9fb4ff;--rd:#ff7b90;--ln:#262e4d;--navy:#0a1233;--btn:#3552c9}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 17px/1.7 var(--sans)}
:focus-visible{outline:2px solid var(--rd);outline-offset:3px}
a{color:var(--bl)}
#sticky{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
header.hd{background:var(--sf);border-bottom:1px solid var(--ln)}
header .in{max-width:1000px;margin:0 auto;padding:10px 24px;display:flex;align-items:center;gap:26px}
.brand{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--tx);font:600 21px var(--serif);flex-shrink:0;white-space:nowrap}
.brand img{height:36px;background:#fff}
header nav{display:flex;gap:22px;overflow-x:auto;font:400 15px var(--sans);flex:1;justify-content:flex-end}
header nav a{color:var(--mu);text-decoration:none;white-space:nowrap;padding:6px 0;border-bottom:1px solid transparent}
header nav a:hover{color:var(--tx);border-color:var(--rd)}
@media(max-width:760px){.brand span{display:none}header nav{justify-content:flex-start}}
.hero{position:relative;height:clamp(360px,62vh,500px);background:var(--navy);overflow:hidden;color:#fff}
.stripes{position:absolute;top:0;right:0;bottom:0;width:58%;background:linear-gradient(90deg,#2f52d6,#c8102e);opacity:.9;-webkit-mask-image:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 16px),linear-gradient(90deg,transparent,#000 70%);-webkit-mask-composite:source-in;mask-image:repeating-linear-gradient(180deg,#000 0 8px,transparent 8px 16px),linear-gradient(90deg,transparent,#000 70%);mask-composite:intersect}
.slides{position:absolute;inset:0}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 max(24px,calc((100% - 1000px)/2 + 24px));opacity:0;transition:opacity 1.2s}
.slide.on{opacity:1}
.slide h1{font:500 clamp(40px,7vw,70px)/1.04 var(--serif);margin:0 0 16px;max-width:640px;color:#fff;letter-spacing:-.01em}
.slide p{margin:0;font-size:19px;max-width:480px;color:rgba(255,255,255,.86)}
.ind{position:absolute;left:max(24px,calc((100% - 1000px)/2 + 24px));bottom:28px;display:flex;gap:8px}
.ind i{width:30px;height:2px;background:rgba(255,255,255,.35);transition:background .6s}
.ind i.on{background:#fff}
.wrap{max-width:1000px;margin:0 auto;padding:48px 24px 24px}
.lead{font:500 clamp(24px,3.4vw,33px)/1.38 var(--serif);margin:0 0 18px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:22px;padding:22px 0;margin-bottom:34px;border-top:1px solid var(--ln);border-bottom:1px solid var(--ln);font-size:16px}
.idx a{display:block;padding:26px 0;border-top:1px solid var(--ln);text-decoration:none;color:var(--tx)}
.idx a:last-child{border-bottom:1px solid var(--ln)}
.idx b{display:block;font:500 36px/1.2 var(--serif)}
.idx span{color:var(--mu);font-size:16px}
.idx a:hover b{color:var(--rd)}
.pt{font:500 clamp(38px,6vw,58px)/1.05 var(--serif);margin:14px 0 30px}
.bk{font-size:15px;color:var(--mu);text-decoration:none}
.bk:hover{color:var(--rd)}
.pg{max-width:760px}
details{border-top:1px solid var(--ln)}
details:last-of-type{border-bottom:1px solid var(--ln)}
summary{cursor:pointer;padding:26px 0;font:500 34px/1.2 var(--serif);list-style:none;display:flex;justify-content:space-between;align-items:center}
summary::-webkit-details-marker{display:none}
summary::after{content:"+";color:var(--rd);font:300 32px var(--sans)}
details[open] summary::after{content:"–"}
details>.body{padding:0 0 36px;max-width:720px}
details[id]{scroll-margin-top:90px}
.card{padding:20px 0;border-top:1px solid var(--ln)}
.card:first-child{border-top:0;padding-top:0}
.card p{margin:4px 0}
h2{font:500 26px var(--serif);margin:40px 0 18px}
h3{font:600 26px/1.2 var(--serif);margin:0 0 6px}
.k{font-size:14px;color:var(--mu);margin-right:10px}
.m{color:var(--mu)}
.logo{background:#fff;border:1px solid var(--ln);padding:18px;display:flex;justify-content:center;align-items:center;height:170px}
.logo img{max-width:100%;max-height:100%;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:30px}
.grid figure{margin:0}
.grid figcaption{margin-top:10px;font-size:14px;color:var(--mu);text-align:center}
button,.btn{font:500 16px var(--sans);min-height:46px;padding:10px 24px;border-radius:2px;border:1px solid var(--btn);background:var(--btn);color:var(--bt);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
button.alt,.btn.alt{background:transparent;color:var(--tx);border-color:var(--ln)}
button.danger{background:transparent;color:var(--rd);border-color:var(--rd)}
header button.th{min-height:36px;width:36px;padding:0;border-radius:50%;background:transparent;color:var(--tx);border:1px solid var(--ln);font-size:16px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
label.f{display:block;margin:14px 0 4px;font-weight:500;font-size:15px}
input[type=text],textarea{width:100%;font:inherit;padding:10px 12px;border:1px solid var(--ln);border-radius:3px;background:var(--bg);color:var(--tx)}
textarea{min-height:110px}
body.ed .card{background:var(--sf);border:1px solid var(--ln);border-radius:4px;padding:16px 18px;margin-bottom:12px}
.bar{background:var(--rd);color:#fff;padding:10px 24px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-weight:500}
.bar button,.bar .btn{min-height:42px;font-size:15px;background:#fff;color:#141a30;border-color:#fff}
footer{margin-top:56px;padding:28px 0 8px;border-top:1px solid var(--ln);color:var(--mu);font-size:15px}
footer p{margin:2px 0}
@media (prefers-reduced-motion:reduce){.slide,.ind i{transition:none}}
</style>
</head>

<script>
(function(){
var SRC=document.documentElement.outerHTML;
var D=JSON.parse(document.getElementById('data').textContent);
var KEYS=['cursos','sobre-nosotros','profesores','proximas','recientes','contacto'];
var NEW={slides:{t:'',p:''},logos:{n:'',s:''}};
function fix(d){d.marca=d.marca||'Alianza por la lengua francesa';if(d.pie==null)d.pie='© Alianza por la Lengua Francesa · La Paz, Baja California Sur';d.intro=d.intro||'';d.slides=d.slides||[];d.logos=d.logos||[];
var df={'cursos':['Cursos','Niveles, horarios y profesores'],'sobre-nosotros':['Sobre nosotros','Quiénes somos y nuestras instituciones'],'profesores':['Profesores','El equipo docente'],'proximas':['Próximas actividades','Lo que viene'],'recientes':['Actividades recientes','Lo que ya sucedió'],'contacto':['Contacto','Dirección y cómo escribirnos']};
d.sec=d.sec||{};KEYS.forEach(function(k){if(!d.sec[k])d.sec[k]={t:df[k][0],s:df[k][1],v:1}});return d}
D=fix(D);
var app=document.getElementById('app'),bar=document.getElementById('bar');
var edit=false,canEdit=false,art=null,dl=null,dirty=false;
var root=document.documentElement;
try{var th=localStorage.getItem('th');if(th)root.setAttribute('data-theme',th)}catch(e){}
var M=[['cursos','Cursos'],['sobre-nosotros','Sobre nosotros'],['profesores','Profesores'],['proximas','Próximas actividades'],['recientes','Actividades recientes'],['contacto','Contacto']];
var L={cursos:{t:'Cursos',f:[['t','Nombre del curso'],['h','Horario'],['p','Profesor/a'],['d','Descripción',1]]},
profesores:{t:'Profesores',f:[['n','Nombre'],['b','Descripción',1]]},
proximas:{t:'Próximas actividades',f:[['t','Título'],['f','Fecha'],['d','Descripción',1]]},
recientes:{t:'Actividades recientes',f:[['t','Título'],['f','Fecha'],['d','Descripción',1]]}};
var C=[['dir','Dirección',1],['mail','Correo electrónico'],['tel','Teléfono'],['hor','Horario de atención'],['red','Redes sociales',1]];
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function nl(s){return esc(s).replace(/\n/g,'<br>')}
function inp(p,lb,v,multi){return '<label class="f">'+lb+'</label>'+(multi?'<textarea data-p="'+p+'">'+esc(v)+'</textarea>':'<input type="text" data-p="'+p+'" value="'+esc(v)+'">')}
function back(){return ''}
function hero(){if(!D.slides.length)return '';var h='<div class="hero"><div class="stripes"></div><div class="slides">';
D.slides.forEach(function(s,i){h+='<div class="slide'+(i?'':' on')+'"><h1>'+esc(s.t)+'</h1><p>'+nl(s.p)+'</p></div>'});
h+='</div><div class="ind">';D.slides.forEach(function(s,i){h+='<i'+(i?'':' class="on"')+'></i>'});return h+'</div></div>'}
function ctl(k,i,n){var h='<div class="row">';if(i>0)h+='<button class="alt" data-act="up" data-k="'+k+'" data-i="'+i+'">Subir</button>';if(i<n-1)h+='<button class="alt" data-act="dn" data-k="'+k+'" data-i="'+i+'">Bajar</button>';return h+'<button class="danger" data-act="del" data-k="'+k+'" data-i="'+i+'">Quitar</button></div>'}
function logoImg(l){return l.s?'<img src="'+l.s+'" alt="'+esc(l.n)+'">':'<span class="m">Sin imagen</span>'}
function home(){var h='<h2>Portada</h2>';
D.slides.forEach(function(s,i){h+='<div class="card">'+inp('slides.'+i+'.t','Título',s.t)+inp('slides.'+i+'.p','Texto',s.p,1)+ctl('slides',i,D.slides.length)+'</div>'});
h+='<button data-act="add" data-k="slides">+ Agregar mensaje a la portada</button><h2>Texto de presentación</h2>'+inp('intro','Separar párrafos con una línea en blanco',D.intro,1);
return h+'<h2>Lista de secciones</h2><p class="m">Los nombres, descripciones y el orden visible de las secciones se cambian en «Ajustes del sitio», en la barra roja de arriba.</p>'}
function ajustes(){var h=inp('marca','Nombre del sitio (barra superior)',D.marca)+inp('pie','Texto del pie de página',D.pie)+'<h2>Secciones</h2>';
KEYS.forEach(function(k){var s=D.sec[k];h+='<div class="card">'+inp('sec.'+k+'.t','Nombre',s.t)+inp('sec.'+k+'.s','Descripción breve',s.s)+'<label class="f"><input type="checkbox" data-chk="'+k+'"'+(s.v?' checked':'')+'> Mostrar en el sitio</label></div>'});
return h+'<p class="m">El primer logo de «Sobre nosotros» es el que aparece en la barra superior.</p>'}
function intro(){var ps=D.intro.split(/\n\s*\n/).filter(function(p){return p.trim()}),h='<div class="pg" style="margin-bottom:34px">';
ps.forEach(function(p,i){h+=i?'<p>'+nl(p.trim())+'</p>':'<p class="lead">'+nl(p.trim())+'</p>'});h+='</div>';
var c=D.contacto,f=[['Dirección',c.dir],['Correo',c.mail],['Horario de atención',c.hor]].filter(function(x){return x[1]});
if(f.length){h+='<div class="facts">';f.forEach(function(x){h+='<div><span class="k">'+x[0]+'</span><br>'+nl(x[1])+'</div>'});h+='</div>'}
return h}
function foot(){return '<footer><p>'+esc(D.contacto.dir)+'</p><p>'+esc(D.pie)+'</p></footer>'}
var tm;function car(){clearInterval(tm);var s=document.querySelectorAll('.slide'),n=document.querySelectorAll('.ind i');if(s.length<2)return;var i=0;tm=setInterval(function(){s[i].classList.remove('on');n[i].classList.remove('on');i=(i+1)%s.length;s[i].classList.add('on');n[i].classList.add('on')},5500)}
function changeLogo(i){return '<div class="row"><label class="btn alt">Cambiar imagen<input type="file" accept="image/*" hidden data-logo="'+i+'"></label></div>'}
function list(k){var c=L[k],a=D[k],h='';
if(!edit){if(!a.length)h+='<p class="m">Por el momento no hay información.</p>';
a.forEach(function(it){h+='<div class="card"><h3>'+esc(it[c.f[0][0]])+'</h3>';
c.f.slice(1).forEach(function(f){if(it[f[0]])h+='<p><span class="k">'+f[1]+'</span>'+nl(it[f[0]])+'</p>'});h+='</div>'})}
else{a.forEach(function(it,i){h+='<div class="card">';
c.f.forEach(function(f){h+=inp(k+'.'+i+'.'+f[0],f[1],it[f[0]],f[2])});
h+=ctl(k,i,a.length)+'</div>'});
h+='<button data-act="add" data-k="'+k+'">+ Agregar</button>'}
return h}
function sobre(){var h='';
if(edit)h+=inp('sobre','Texto (separar párrafos con una línea en blanco)',D.sobre,1);
else D.sobre.split(/\n\s*\n/).forEach(function(p){if(p.trim())h+='<p>'+nl(p.trim())+'</p>'});
h+='<h2 style="margin-top:28px">Nuestras instituciones</h2><div class="grid">';
D.logos.forEach(function(l,i){h+='<figure><div class="logo">'+logoImg(l)+'</div>';
if(edit)h+=inp('logos.'+i+'.n','Nombre',l.n)+changeLogo(i)+ctl('logos',i,D.logos.length);else h+='<figcaption>'+esc(l.n)+'</figcaption>';
h+='</figure>'});
return h+'</div>'+(edit?'<div class="row"><button data-act="add" data-k="logos">+ Agregar logo</button></div>':'')}
function contacto(){var h='<div class="card">';
C.forEach(function(f){var v=D.contacto[f[0]];
if(edit)h+=inp('contacto.'+f[0],f[1],v,f[2]);
else if(v){h+='<p><span class="k">'+f[1]+'</span>'+(f[0]==='mail'?'<a href="mailto:'+esc(v)+'">'+esc(v)+'</a>':nl(v))+'</p>'}});
return h+'</div>'}
function vis(k){return D.sec[k].v||edit}
function render(){
var r=(location.hash||'#inicio').slice(1),ad=r==='sitio'&&edit,m=KEYS.indexOf(r)>=0&&vis(r)?r:null;
document.body.classList.toggle('ed',edit);
document.title=D.marca;document.getElementById('bn').textContent=D.marca;
var lg=D.logos[0],hl=document.getElementById('hl');if(lg&&lg.s){hl.src=lg.s;hl.style.display=''}else hl.style.display='none';
var nv='';KEYS.forEach(function(k){if(D.sec[k].v)nv+='<a href="#'+k+'">'+esc(D.sec[k].t)+'</a>'});document.getElementById('nv').innerHTML=nv;
document.getElementById('hs').innerHTML=(!m&&!ad&&!edit)?hero():'';
var h='';
if(ad)h+='<a class="bk" href="#inicio">← Inicio</a><h1 class="pt">Ajustes del sitio</h1><div class="pg">'+ajustes()+'</div>';
else if(m)h+='<a class="bk" href="#inicio">← Inicio</a><h1 class="pt">'+esc(D.sec[m].t)+'</h1><div class="pg">'+(m==='sobre-nosotros'?sobre():m==='contacto'?contacto():list(m))+'</div>';
else{h+=edit?home():intro();h+='<div class="idx">';
KEYS.forEach(function(k){if(vis(k))h+='<a href="#'+k+'"><b>'+esc(D.sec[k].t)+(D.sec[k].v?'':' (oculta)')+'</b><span>'+esc(D.sec[k].s)+'</span></a>'});h+='</div>';
if(canEdit&&!edit)h+='<div class="row" style="margin-top:34px"><button class="alt" data-act="enter">Entrar como administrador</button></div>'}
h+=foot();app.innerHTML=h;renderBar();car()}
function renderBar(){
if(!edit){bar.innerHTML='';return}
bar.innerHTML='<span>Modo administrador</span><button data-act="save">Guardar cambios</button><button data-act="bk">Descargar copia</button><label class="btn">Restaurar copia<input type="file" accept=".json,application/json" hidden id="rf"></label><a class="btn" href="#inicio">Inicio</a><a class="btn" href="#sitio">Ajustes del sitio</a><button data-act="exit">Salir</button><span id="st">'+(dirty?'Hay cambios sin guardar':'')+'</span>'}
function setP(p,v){var a=p.split('.'),o=D;for(var i=0;i<a.length-1;i++)o=o[a[i]];o[a[a.length-1]]=v}
function mark(){dirty=true;var s=document.getElementById('st');if(s)s.textContent='Hay cambios sin guardar'}
function html(){var j=JSON.stringify(D).replace(/</g,'\\u003c');
return '<!DOCTYPE html>\n'+SRC.replace(/<title>[\s\S]*?<\/title>/,'<title>'+esc(D.marca)+'</title>').replace(/(<script type="application\/json" id="data">)[\s\S]*?(<\/script>)/,function(m,a,b){return a+j+b})}
function save(){if(!art){alert('No tenés permiso para guardar.');return}
var s=document.getElementById('st');if(s)s.textContent='Guardando…';
art.publish(html()).catch(function(e){if(s)s.textContent='';alert('No se pudo guardar. Intentá de nuevo.')})}
function backup(){var d=new Date().toISOString().slice(0,10);
if(!dl){alert('Descarga no disponible en este momento.');return}
dl.save({filename:'respaldo-alianza-francesa-'+d+'.json',data:JSON.stringify(D,null,1)}).catch(function(){})}
document.addEventListener('input',function(e){var p=e.target.getAttribute&&e.target.getAttribute('data-p');if(p){setP(p,e.target.value);mark()}});
document.addEventListener('change',function(e){var t=e.target;
if(t.getAttribute&&t.getAttribute('data-chk')){D.sec[t.getAttribute('data-chk')].v=t.checked?1:0;mark();return}
